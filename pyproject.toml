[project]
name = "implicature-bench"
version = "0.1.0"
description = "Inspect AI port of a 25-item Gricean implicature benchmark built from the Friends Corpus"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
openai = ["openai>=1.0.0"]
google = ["google-generativeai>=0.8.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/implicature_bench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
